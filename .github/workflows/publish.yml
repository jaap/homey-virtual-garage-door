name: Publish to Homey App Store

# Publishing a GitHub release tagged vX.Y.Z pushes that build to the Homey
# App Store (as a draft, to be promoted to Test/Live in the developer
# dashboard). Requires the repository secret HOMEY_PAT — a Personal Access
# Token from https://tools.developer.homey.app/me.
#
# Athom's official publish action is not used directly because its wrapper
# runs `npm ci --ignore-scripts`, which skips the prepare script that
# generates the manifest PNGs. These steps use the exact same
# headless-publish contract the action wraps, with scripts enabled.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check that the release tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./app.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match app version ${VERSION}."
            echo "::error::Run 'npm run set-version ${TAG}', commit, push, then re-create the release."
            exit 1
          fi

      - run: npm ci # also generates the manifest PNGs via prepare
      - run: npm test
      - run: npm install --global homey
      - run: homey app validate --level publish

      - name: Write the store changelog from the release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./app.json").version;
            let text = (process.env.RELEASE_BODY || process.env.RELEASE_NAME || "").replace(/\r/g, "").replace(/\s+/g, " ").trim();
            if (!text) text = "See the GitHub release notes.";
            if (text.length > 400) text = `${text.slice(0, 397)}...`;
            const file = ".homeychangelog.json";
            const changelog = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
            changelog[version] = { en: text };
            fs.writeFileSync(file, `${JSON.stringify(changelog, null, 2)}\n`);
            console.log(`changelog ${version}: ${text}`);
          '

      - name: Publish
        env:
          HOMEY_HEADLESS: '1'
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: homey app publish
