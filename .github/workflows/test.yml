name: Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm install (not ci): the project intentionally has no lockfile, and
      # the prepare script generates the manifest PNGs the tests assert on
      - run: npm install
      - run: npm test

  validate:
    name: Homey app validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm install --global homey
      - run: homey app validate --level publish
